<template>
    <!-- Page Header -->
    <div class="slds-p-bottom_xx-small">
        <div class="slds-page-header">
            <div class="slds-page-header__row">
                <div class="slds-page-header__col-title">
                    <div class="slds-media">
                        <div class="slds-media__figure">
                            <lightning-icon class="icon" icon-name="standard:file"
                                alternative-text="File Recovery Vault">
                            </lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <h1 class="header">
                                <span class="slds-page-header__title slds-truncate" title="Data Recovery Vault">Data Recovery Vault</span>
                            </h1>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <lightning-card>
        <div class="slds-p-horizontal_medium slds-p-bottom_medium">

            <!-- ═══════════════════════════════════════════════════════════
                 STEP 1 : Action Selection  (Backup / Restore)
            ═══════════════════════════════════════════════════════════ -->
            <template if:true={showOptionSelection}>
                <div class="slds-text-heading_small slds-m-bottom_medium custom-heading">Select an option</div>
                <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center">
                    <div class="option-item">
                        <lightning-input type="radio" variant="label-hidden" name="action" value="backup"
                            checked={isBackupSelected} onchange={handleSelection}></lightning-input>
                        <span class="option-label">Backup</span>
                        <lightning-helptext content="Backup your org data, metadata, config or full org">
                        </lightning-helptext>
                    </div>
                    <div class="or-text slds-m-horizontal_large">or</div>
                    <div class="option-item">
                        <lightning-input type="radio" variant="label-hidden" name="action" value="restore"
                            checked={isRestoreSelected} onchange={handleSelection}></lightning-input>
                        <span class="option-label">Restore</span>
                        <lightning-helptext content="Restore previously backed up content"></lightning-helptext>
                    </div>
                </div>
                <div class="slds-text-align_right slds-m-top_large">
                    <lightning-button label="Next" variant="brand" disabled={isNextDisabled} onclick={handleNext}>
                    </lightning-button>
                </div>
            </template>

            <!-- ═══════════════════════════════════════════════════════════
                 STEP 2 (BACKUP PATH) : Instant Backup / Schedule Backup
            ═══════════════════════════════════════════════════════════ -->
            <template if:true={showBackupModeSelection}>
                <div class="slds-text-heading_small slds-m-bottom_medium custom-heading">Select Backup Mode</div>
                <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center">
                    <div class="option-item">
                        <lightning-input type="radio" variant="label-hidden" name="backupMode" value="instant"
                            checked={isInstantModeSelected} onchange={handleBackupModeSelection}></lightning-input>
                        <span class="option-label">Instant Backup</span>
                        <lightning-helptext content="Run backup immediately, one time only"></lightning-helptext>
                    </div>
                    <div class="or-text slds-m-horizontal_large">or</div>
                    <div class="option-item">
                        <lightning-input type="radio" variant="label-hidden" name="backupMode" value="schedule"
                            checked={isScheduleModeSelected} onchange={handleBackupModeSelection}></lightning-input>
                        <span class="option-label">Schedule Backup</span>
                        <lightning-helptext content="Schedule recurring backup (Daily / Weekly / Monthly)">
                        </lightning-helptext>
                    </div>
                </div>
                <div class="slds-grid slds-grid_align-spread slds-m-top_large">
                    <lightning-button label="Back" onclick={handleBackupModeBack}></lightning-button>
                    <lightning-button label="Next" variant="brand" disabled={isBackupModeNextDisabled}
                        onclick={handleBackupModeNext}></lightning-button>
                </div>
            </template>

            <!-- ═══════════════════════════════════════════════════════════
                 STEP 2 (RESTORE PATH) : Instant Restore / Schedule Restore
            ═══════════════════════════════════════════════════════════ -->
            <template if:true={showRestoreModeSelection}>
                <div class="slds-text-heading_small slds-m-bottom_medium custom-heading">Select Restore Mode</div>
                <div class="slds-grid slds-grid_align-center slds-grid_vertical-align-center">
                    <div class="option-item">
                        <lightning-input type="radio" variant="label-hidden" name="restoreMode" value="instant"
                            checked={isInstantRestoreModeSelected} onchange={handleRestoreModeSelection}>
                        </lightning-input>
                        <span class="option-label">Instant Restore</span>
                        <lightning-helptext content="Run restore immediately, one time only"></lightning-helptext>
                    </div>
                    <div class="or-text slds-m-horizontal_large">or</div>
                    <div class="option-item">
                        <lightning-input type="radio" variant="label-hidden" name="restoreMode" value="schedule"
                            checked={isScheduleRestoreModeSelected} onchange={handleRestoreModeSelection}>
                        </lightning-input>
                        <span class="option-label">Schedule Restore</span>
                        <lightning-helptext content="Schedule recurring restore (Daily / Weekly / Monthly)">
                        </lightning-helptext>
                    </div>
                </div>
                <div class="slds-grid slds-grid_align-spread slds-m-top_large">
                    <lightning-button label="Back" onclick={handleRestoreModeBack}></lightning-button>
                    <lightning-button label="Next" variant="brand" disabled={isRestoreModeNextDisabled}
                        onclick={handleRestoreModeNext}></lightning-button>
                </div>
            </template>

            <!-- ═══════════════════════════════════════════════════════════
                 STEP 3 (BACKUP PATH) : Select Backup Type Cards
            ═══════════════════════════════════════════════════════════ -->
            <template if:true={showBackupTypeSelection}>
                <div class="slds-text-heading_small slds-m-bottom_medium custom-heading">Select Backup Type</div>
                <div class="slds-grid slds-gutters slds-wrap slds-grid_align-center">
                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_x-small">
                        <div class={backupTypeDataClass} onclick={handleBackupTypeSelect} data-type="data">
                            <div class="type-card-icon">
                                <lightning-icon icon-name="standard:record" size="medium"></lightning-icon>
                            </div>
                            <div class="type-card-title">Data Backup</div>
                            <div class="type-card-desc">Back up records across standard and custom objects. Supports
                                selective record filtering, related file attachments, and scheduled exports.</div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_x-small">
                        <div class={backupTypeMetadataClass} onclick={handleBackupTypeSelect} data-type="metadata">
                            <div class="type-card-icon">
                                <lightning-icon icon-name="standard:apex" size="medium"></lightning-icon>
                            </div>
                            <div class="type-card-title">Metadata Backup</div>
                            <div class="type-card-desc">Capture your org's configuration layer — Apex classes, Lightning
                                components, Flows, Profiles, Permission Sets, page layouts, and more.</div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_x-small">
                        <div class={backupTypeConfigClass} onclick={handleBackupTypeSelect} data-type="config">
                            <div class="type-card-icon">
                                <lightning-icon icon-name="standard:settings" size="medium"></lightning-icon>
                            </div>
                            <div class="type-card-title">Config Backup</div>
                            <div class="type-card-desc">Save critical operational settings including Custom Metadata
                                Types, Custom Settings, Named Credentials, Remote Site Settings, and Email Templates.
                            </div>
                        </div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4 slds-p-around_x-small">
                        <div class={backupTypeOrgfullClass} onclick={handleBackupTypeSelect} data-type="orgfull">
                            <div class="type-card-icon">
                                <lightning-icon icon-name="standard:all" size="medium"></lightning-icon>
                            </div>
                            <div class="type-card-title">Org Full Backup</div>
                            <div class="type-card-desc">A complete snapshot of your entire Salesforce org — combining
                                Data, Metadata, and Config. Perfect for disaster recovery or org migration.</div>
                        </div>
                    </div>
                </div>
                <div class="slds-grid slds-grid_align-spread slds-m-top_large">
                    <lightning-button label="Back" onclick={handleBackupTypeBack}></lightning-button>
                    <lightning-button label="Next" variant="brand" disabled={isBackupTypeNextDisabled}
                        onclick={handleBackupTypeNext}></lightning-button>
                </div>
            </template>

            <!-- ═══════════════════════════════════════════════════════════
                 DATA BACKUP
            ═══════════════════════════════════════════════════════════ -->
            <template if:true={showDataBackup}>
                <div class="metadata-header">
                    <div class="icon-section">
                        <lightning-icon icon-name="standard:record" size="medium"></lightning-icon>
                    </div>
                    <div class="slds-text-heading_small custom-heading">Data Backup</div>
                </div>

                <div class="slds-grid slds-wrap slds-grid_align-center">
                    <div class="slds-col slds-size_10-of-12">
                        <div class="slds-grid slds-gutters">
                            <!-- Object Multiselect -->
                            <div class="slds-col slds-size_1-of-2">
                                <div class="multiselect-wrapper slds-is-relative">
                                    <label class="slds-form-element__label"><abbr class="slds-required" title="required">*</abbr> Select Objects</label>
                                    <div class={dataObjectTriggerClass} onclick={toggleDataObjectDropdown}>
                                        <template if:true={hasDataSelectedObjects}>
                                            <span class="ms-preview-text">{dataSelectedObjectLabels}</span>
                                            <span class="ms-badge">{dataSelectedObjectsCount}</span>
                                            <lightning-button-icon icon-name="utility:close" alternative-text="Clear"
                                                variant="bare" size="small" onclick={clearDataObjects}>
                                            </lightning-button-icon>
                                        </template>
                                        <template if:false={hasDataSelectedObjects}>
                                            <span class="ms-placeholder">Choose Objects</span>
                                            <lightning-icon icon-name="utility:down" size="x-small" class="ms-arrow">
                                            </lightning-icon>
                                        </template>
                                    </div>
                                    <template if:true={isDataObjectDropdownOpen}>
                                        <div class="ms-dropdown slds-is-absolute">
                                            <div class="ms-search" onclick={stopPropagation}>
                                                <lightning-input type="search" variant="label-hidden"
                                                    placeholder="Search objects..." value={dataObjectSearchTerm}
                                                    onchange={handleDataObjectSearch}></lightning-input>
                                            </div>
                                            <div class="ms-select-all" onclick={toggleSelectAllDataObjects}>
                                                <template if:true={isSelectAllDataObjectsLoading}>
                                                    <div class="ms-select-all-spinner slds-is-relative">
                                                        <lightning-spinner alternative-text="Loading..." size="small"
                                                            variant="brand"></lightning-spinner>
                                                    </div>
                                                </template>
                                                <template if:false={isSelectAllDataObjectsLoading}>
                                                    <span class={selectAllDataObjectsCheckboxClass}>
                                                        <template if:true={isAllDataObjectsSelected}>
                                                            <svg class="ms-check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                                                        </template>
                                                    </span>
                                                    <span class="ms-item-label ms-select-all-label">Select All</span>
                                                    <span class="ms-select-all-count">({rawObjectOptions.length})</span>
                                                </template>
                                            </div>
                                            <ul class="ms-list">
                                                <template if:true={hasFilteredDataObjects}>
                                                    <template for:each={filteredDataObjects} for:item="obj">
                                                        <li key={obj.value} class={obj.itemClass} data-value={obj.value}
                                                            onclick={handleDataObjectToggle}>
                                                            <span class={obj.checkboxClass}>
                                                                <template if:true={obj.checked}>
                                                                    <svg class="ms-check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                                                                </template>
                                                            </span>
                                                            <span class="ms-item-label">{obj.label}</span>
                                                        </li>
                                                    </template>
                                                </template>
                                                <template if:false={hasFilteredDataObjects}>
                                                    <li class="ms-no-results">No objects found</li>
                                                </template>
                                            </ul>
                                        </div>
                                    </template>
                                </div>
                            </div>
                            <!-- Record Multiselect -->
                            <div class="slds-col slds-size_1-of-2">
                                <div class="multiselect-wrapper slds-is-relative">
                                    <label class="slds-form-element__label">Select Records</label>
                                    <template if:true={isLoadingDataRecords}>
                                        <div class="slds-align_absolute-center slds-p-around_small">
                                            <lightning-spinner alternative-text="Loading records..." size="small">
                                            </lightning-spinner>
                                        </div>
                                    </template>



                                    <template if:false={isLoadingDataRecords}>
                                        <div class={computedDataRecordClass} onclick={handleRecordClick}>
                                            <template if:true={hasDataSelectedRecords}>
                                                <span class="ms-preview-text">{dataSelectedRecordLabels}</span>
                                                <span class="ms-badge">{dataSelectedRecordsCount}</span>
                                                <lightning-button-icon icon-name="utility:close"
                                                    alternative-text="Clear" variant="bare" size="small"
                                                    onclick={clearDataRecords}>
                                                </lightning-button-icon>
                                            </template>
                                            <template if:false={hasDataSelectedRecords}>
                                                <span class="ms-placeholder">
                                                  <template if:true={isDataMultipleObjects}>Multiple objects selected</template>
                                                  <template if:false={isDataMultipleObjects}>Select an Object to Continue</template>
                                                </span>
                                                <lightning-icon icon-name="utility:down" size="x-small"
                                                    class="ms-arrow">
                                                </lightning-icon>
                                            </template>
                                        </div>
                                        <template if:true={noDataRecordsAvailable}>
                                            <div class="error-text">
                                                <lightning-icon icon-name="utility:error" size="xx-small"
                                                    class="slds-m-right_xx-small"></lightning-icon>
                                                No Records Available.
                                            </div>
                                        </template>
                                        <template if:true={isDataRecordDropdownOpen}>
                                            <div class="ms-dropdown slds-is-absolute">
                                                <div class="ms-search" onclick={stopPropagation}>
                                                    <lightning-input type="search" variant="label-hidden"
                                                        placeholder="Search records..." value={dataRecordSearchTerm}
                                                        onchange={handleDataRecordSearch}></lightning-input>
                                                </div>
                                                <div class="ms-select-all" onclick={toggleSelectAllDataRecords}>
                                                    <template if:true={isSelectAllDataRecordsLoading}>
                                                        <div class="ms-select-all-spinner slds-is-relative">
                                                            <lightning-spinner alternative-text="Loading..."
                                                                size="small" variant="brand"></lightning-spinner>
                                                        </div>
                                                    </template>
                                                    <template if:false={isSelectAllDataRecordsLoading}>
                                                        <span class={selectAllDataRecordsCheckboxClass}>
                                                            <template if:true={isAllDataRecordsSelected}>
                                                                  <svg class="ms-check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                                                            </template>
                                                        </span>
                                                        <span class="ms-item-label ms-select-all-label">Select All</span>
                                                        <span class="ms-select-all-count">({dataRawRecordOptions.length})</span>
                                                    </template>
                                                </div>
                                                <ul class="ms-list">
                                                    <template if:true={hasFilteredDataRecords}>
                                                        <template for:each={filteredDataRecords} for:item="rec">
                                                            <li key={rec.value} class={rec.itemClass}
                                                                data-value={rec.value} onclick={handleDataRecordToggle}>
                                                                <span class={rec.checkboxClass}>
                                                                    <template if:true={rec.checked}>
                                                                     <svg class="ms-check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                                                                    </template>
                                                                </span>
                                                                <span class="ms-item-label">{rec.label}</span>
                                                            </li>
                                                        </template>
                                                    </template>
                                                    <template if:false={hasFilteredDataRecords}>
                                                        <li class="ms-no-results">No records found</li>
                                                    </template>
                                                </ul>
                                            </div>
                                        </template>
                                    </template>
                                </div>
                                <template if:true={isDataMultipleObjects}>
                                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                        <lightning-icon icon-name="utility:info" size="xx-small"
                                            class="slds-m-right_xx-small"></lightning-icon>
                                        Record selection unavailable when multiple objects are selected.
                                    </p>
                                </template>
                            </div>
                        </div>
                        <!-- SCHEDULE SECTION — only shown for Schedule Backup mode -->
                        <template if:true={isScheduleMode}>
                            <div class="schedule-section slds-m-top_medium">
                                <div class="schedule-section-title">
                                    <lightning-icon icon-name="utility:clock" size="x-small"
                                        class="slds-m-right_x-small"></lightning-icon>
                                    Scheduling Frequency
                                </div>
                                <div class="schedule-options">
                                    <div class={scheduleDailyClass} data-freq="daily" onclick={handleScheduleSelect}>
                                        <div class="schedule-radio-dot slds-is-relative"></div>
                                        <div class="schedule-option-content">
                                            <div class="schedule-option-title">Daily</div>
                                            <div class="schedule-option-desc">Runs every day at a set time</div>
                                        </div>
                                    </div>
                                    <div class={scheduleWeeklyClass} data-freq="weekly" onclick={handleScheduleSelect}>
                                        <div class="schedule-radio-dot slds-is-relative"></div>
                                        <div class="schedule-option-content">
                                            <div class="schedule-option-title">Weekly</div>
                                            <div class="schedule-option-desc">Runs once per week on a set day</div>
                                        </div>
                                    </div>
                                    <div class={scheduleMonthlyClass} data-freq="monthly"
                                        onclick={handleScheduleSelect}>
                                        <div class="schedule-radio-dot slds-is-relative"></div>
                                        <div class="schedule-option-content">
                                            <div class="schedule-option-title">Monthly</div>
                                            <div class="schedule-option-desc">Runs once per month on a set date</div>
                                        </div>
                                    </div>
                                </div>
                                <template if:true={showScheduleTimeField}>
                                    <div class="schedule-fields slds-m-top_small">
                                        <lightning-input type="time" label="Start Time" value={scheduleTime}
                                            onchange={handleScheduleTimeChange} class="schedule-time-input">
                                        </lightning-input>
                                        <template if:true={showScheduleWeekday}>
                                            <lightning-combobox label="Day of Week" value={scheduleWeekday}
                                                options={weekdayOptions} onchange={handleWeekdayChange}
                                                class="schedule-combo-input"></lightning-combobox>
                                        </template>
                                        <template if:true={showScheduleMonthDay}>
                                            <lightning-input type="number" label="Date of Month"
                                                value={scheduleMonthDay} min="1" max="31"
                                                onchange={handleMonthDayChange} class="schedule-combo-input">
                                            </lightning-input>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>

                <div class="slds-grid slds-grid_align-spread slds-m-top_large">
                    <lightning-button label="Back" disabled={isJobRunning} onclick={handleDataBack}></lightning-button>
                    <lightning-button label="Start Backup" variant="brand" disabled={isDataBackupDisabled}
                        onclick={startDataBackup}></lightning-button>
                </div>
            </template>

            <!-- ═══════════════════════════════════════════════════════════
                 METADATA BACKUP
            ═══════════════════════════════════════════════════════════ -->
            <template if:true={showMetadataBackup}>
                <div class="metadata-header">
                    <div class="icon-section">
                        <lightning-icon icon-name="standard:apex" size="medium"></lightning-icon>
                    </div>
                    <div class="slds-text-heading_small custom-heading">Metadata Backup</div>
                </div>
                <div class="split-layout">
                    <div class="split-nav">
                        <template for:each={metadataNavTree} for:item="group">
                            <div key={group.key}>
                                <div class={group.groupRowClass}>
                                    <span class={group.groupCheckboxClass} data-gkey={group.key} onclick={handleMetadataGroupCheckbox}>
                                        <template if:true={group.allChecked}>
                                            <svg class="ms-check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                                        </template>
                                    </span>
                                    <lightning-icon icon-name={group.icon} size="x-small" class="nav-icon">
                                    </lightning-icon>
                                    <span class="nav-group-label">{group.label}</span>
                                    <span class={group.groupBadgeClass}>{group.selectedCount}</span>
                                </div>
                                <template for:each={group.subItems} for:item="sub">
                                    <div key={sub.key} class={sub.subRowClass} data-gkey={group.key} data-skey={sub.key}
                                        data-ischildsub={sub.isChildSub} data-parentskey={sub.parentSKey}
                                        onclick={handleMetadataSubItemClick}>
                                        <span class={sub.subCheckboxClass}
              data-gkey={group.key} data-skey={sub.key}
              data-ischildsub={sub.isChildSub}
              data-parentskey={sub.parentSKey}
              onclick={handleMetadataSubCheckbox}>
            <template if:true={sub.checked}>
                <svg class="ms-check-icon" xmlns="http://www.w3.org/2000/svg"
                     viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="3">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
            </template>
        </span>
                                        <span class="nav-sub-label">{sub.label}</span>
                                        <template if:true={sub.hasChildren}>
                                            <span class={sub.chevronClass}
                  data-gkey={group.key} data-skey={sub.key}
                  onclick={handleSubChevronClick}>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2.5"
                     class="chevron-svg">
                    <polyline points="9 18 15 12 9 6"/>
                </svg>
            </span>
                                        </template>
                                        <template if:true={sub.isLoading}>
                                            <div class="nav-sub-spinner slds-is-relative">
                                                <lightning-spinner alternative-text="Loading..." size="xx-small"
                                                    variant="brand">
                                                </lightning-spinner>
                                            </div>
                                        </template>
                                        <template if:false={sub.isLoading}>
                                            <span class={sub.subBadgeClass}>{sub.count}</span>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                    <div class="split-panel">
                        <template if:true={hasActiveMetadataSubItem}>
                            <div class="panel-header">
                                <span class="panel-title">{activeMetadataSubItem.label}</span>
                                <div class="panel-toggle-all" onclick={toggleAllActiveMetadataPanel}>
                                    <template if:true={isActivePanelAllSelected}>Deselect All</template>
                                    <template if:false={isActivePanelAllSelected}>Select All
                                        ({activePanelTotal})</template>
                                </div>
                            </div>
                            <template if:true={showPanelSearchBar}>
                                <div class="panel-search">
                                    <lightning-input type="search" variant="label-hidden" placeholder="Search"
                                        value={panelSearchTerm} onchange={handlePanelSearch}></lightning-input>
                                </div>
                            </template>
                            <div class="panel-list">
                                <template if:true={isLoadingActivePanel}>
                                    <div class="panel-loading slds-is-relative">
                                        <lightning-spinner alternative-text="Loading..." size="small" variant="brand">
                                        </lightning-spinner>
                                    </div>
                                </template>
                                <template if:false={isLoadingActivePanel}>
                                    <template if:true={hasActivePanelItems}>
                                        <template for:each={activePanelItems} for:item="item">
                                            <div key={item.value} class={item.rowClass} data-value={item.value}
                                                onclick={handlePanelItemToggle}>
                                                <span class={item.checkboxClass}>
                                                    <template if:true={item.checked}>
                                                        <svg class="ms-check-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                                                    </template>
