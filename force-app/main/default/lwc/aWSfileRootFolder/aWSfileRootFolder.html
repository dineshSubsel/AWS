<template>
	<div class="slds-p-bottom_xx-small">
	 	<div class="slds-page-header">
		<div class="slds-page-header__row">
				<div class="slds-page-header__col-title">
					<div class="slds-media"> 
						 <div class="slds-media__body"> 
							<h1>
								<span class="slds-page-header__title slds-truncate" title="File Manager">File Manager</span>
							</h1>
						</div>
					 </div>
			</div>
			 </div> 
		</div>
	</div>
	<div class="slds-grid slds-gutters_xxx-small">
		<div class="slds-col slds-size_4-of-12 ">

			<article class="slds-card">
				<template if:true={showComp}>
				<div class="slds-card__body slds-card__body_inner">
				
					<lightning-tree items={items} onselect={handleOnselect} class="tree-item">{folderId}
					</lightning-tree>
					
				</div>
				</template>
			</article>
		</div>
		<div class="slds-col slds-size_8-of-12">
			<template if:true={showFile}>
			<c-file-display folder-type={type} parent-record-names={selectedLabel} folder-parent-id={folderId} type={type} onrecordinserted={handleRecordInserted}  onsendtoparent={handleChildEvent} onbackevent={handelBackEvent}></c-file-display> 
			</template>
		</div>

	</div>
	</template>
